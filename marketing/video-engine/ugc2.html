// homography: rect (0,0,w,h) -> quad [[x,y]x4] TL TR BR BL
function homog(w, h, q) {
  const src = [[0,0],[w,0],[w,h],[0,h]], A = [], b = [];
  for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = q[i];
    A.push([x, y, 1, 0, 0, 0, -x*u, -y*u]); b.push(u); A.push([0, 0, 0, x, y, 1, -x*v, -y*v]); b.push(v); }
  for (let c = 0; c < 8; c++) { let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];

  const hh = b.map((v, i) => v / A[i][i]);
  return `matrix3d(${hh[0]},${hh[3]},0,${hh[6]},${hh[1]},${hh[4]},0,${hh[7]},0,0,1,0,${hh[2]},${hh[5]},0,1)`;

const s = Math.max(1080 / sc.W, 1920 / sc.H), ox = (1080 - sc.W * s) / 2, oy = (1920 - sc.H * s) / 2;
const stage = $('stage'); stage.style.width = sc.W + 'px'; stage.style.height = sc.H + 'px'; stage.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
if (sc.base) stage.insertAdjacentHTML('beforeend', `<img src="${sc.base}" style="width:${sc.W}px;height:${sc.H}px;${sc.night ? 'filter:brightness(.5) saturate(.8) sepia(.25)' : ''}">`);
const quad = document.createElement('div'); quad.className = 'quad'; quad.style.transform = homog(393, 852, sc.q); stage.appendChild(quad);
if (sc.top) stage.insertAdjacentHTML('beforeend', `<img src="${sc.top}" style="width:${sc.W}px;height:${sc.H}px">`);
if (sc.night) stage.insertAdjacentHTML('beforeend', `<div style="position:absolute;inset:0;background:radial-gradient(60% 40% at 62% 46%,rgba(255,240,220,.16),rgba(0,0,0,0) 70%)"></div>`);
$('rig').style.transformOrigin = `${sc.origin[0]}px ${sc.origin[1]}px`;
$('pcap').style.top = sc.cap + 'px';
// end
$('end').innerHTML = `${v.endMascot ? '<img class="m" src="mascot/drop.png">' : '<img class="icon" src="icon.png">'}<div class="w">Skinstel<b>.</b></div><div class="t">Find the ingredient <em>breaking you out.</em></div><div class="p">Free on the App Store</div>`;

function popCap(el, dt) { el.style.opacity = clamp(dt / .12); el.style.transform = `scale(${.85 + .15 * spring((dt - .05) / .45)})`; }
let lastCap = null;
window.render = async (t) => {
  $('hook').style.display = t < A ? 'block' : 'none';
  $('pov').style.display = t >= A && t < B ? 'block' : 'none';
  $('end').style.display = t >= B ? 'flex' : 'none';
  if (t < A) {
    if (v.hook.seq) { const f = Math.min(v.hook.frames, Math.floor(t * (v.hook.fps || 30)) + 1); const src = `${v.hook.seq}/f${String(f).padStart(4, '0')}.jpg`;
      if (!hookimg.src.endsWith(src)) { hookimg.src = src; await hookimg.decode().catch(() => {}); } hookimg.style.transform = 'none'; }
    else hookimg.style.transform = `${shake(t, 1)} scale(${1.06 + 0.07 * ease(t / A)})`;
    popCap($('hookcap'), t);
  } else if (t < B) {
    const u = t - A;
    $('rig').style.transform = `${shake(t, .8)} scale(${sc.zoom[0] + (sc.zoom[1] - sc.zoom[0]) * ease(u / v.dur)})`;
    const r = v.pov(u);
    quad.innerHTML = r.layers.map((l, li) => `<div class="scr" style="z-index:${li + 1};isolation:isolate;transform:${l.tf || 'none'};opacity:${l.op == null ? 1 : l.op}">${SCREENS[l.s](l.st)}<div class="home"></div></div>`).join('')
      + (r.flash ? `<div style="position:absolute;inset:0;background:#fff;opacity:${r.flash};z-index:70"></div>` : '')
      + (r.touch ? `<div class="scr" style="background:none;pointer-events:none;z-index:90"><div class="touch" style="left:${r.touch[0]}px;top:${r.touch[1]}px"></div></div>` : '') + '<div class="island"></div><div class="glare"></div>';
    await Promise.all([...quad.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
    window.paintFaces && window.paintFaces(quad);
    const c = v.caps.find(c => u >= c[0] && u < c[1]) || v.caps[v.caps.length - 1];
    $('pcap').firstElementChild.textContent = c[2]; popCap($('pcap'), u - c[0] - .1);
  } else {
    [...$('end').children].forEach((c, i) => { const dt = t - B - i * .1; c.style.opacity = clamp(dt / .2); c.style.transform = `translateY(${(1 - spring(dt / .5)) * 40}px)`; });
  }
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
