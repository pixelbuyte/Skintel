<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skintel bottle render</title>
<!--
  A generic pump bottle (no real brand) rendered with three.js to a transparent PNG.
  bottle.html?view=front → label side, ?view=back → barcode side. render.py screenshots it.
  three.js is not committed: render.py links vendor/ to an `npm i three@0.170.0` install.
-->
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../../../ios/Skintel/Skintel/Resources/Fonts/InstrumentSerif-Regular.ttf"); }
  @font-face { font-family: "DM Sans"; font-weight: 600; src: url("../../../ios/Skintel/Skintel/Resources/Fonts/DMSans-SemiBold.ttf"); }
  @font-face { font-family: "JetBrains Mono"; src: url("../../../ios/Skintel/Skintel/Resources/Fonts/JetBrainsMono-Regular.ttf"); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/build/three.module.js", "three/addons/": "./vendor/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const view = q.get("view") || "front";
const W = +(q.get("w") || 900), H = +(q.get("h") || 1400);

await Promise.all([
  document.fonts.load('80px "Instrument Serif"'),
  document.fonts.load('600 40px "DM Sans"'),
  document.fonts.load('30px "JetBrains Mono"'),
]);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(24, W / H, 0.1, 100);
camera.position.set(0, 0.35, 15.5);
camera.lookAt(0, 0.1, 0);

// Warm key from the upper left, cool rim from behind right: matches the cream/clay page.
const key = new THREE.DirectionalLight(0xfff1e2, 2.2); key.position.set(-4, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xe4ecf0, 1.6); rim.position.set(5, 2, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const bottle = new THREE.Group();
scene.add(bottle);

// ---- Body: lathe profile with a soft shoulder and rounded base (units ≈ cm/2).
const R = 1.05, BODY_H = 3.6, BASE_Y = -2.2;
const pts = [];
pts.push(new THREE.Vector2(0, BASE_Y));
for (let i = 0; i <= 8; i++) { // rounded base corner
  const a = -Math.PI / 2 + (i / 8) * (Math.PI / 2);
  pts.push(new THREE.Vector2(R - 0.18 + Math.cos(a) * 0.18, BASE_Y + 0.18 + Math.sin(a) * 0.18));
}
pts.push(new THREE.Vector2(R, BASE_Y + BODY_H - 0.5));
for (let i = 1; i <= 14; i++) { // shoulder
  const t = i / 14;
  const r = R - (R - 0.42) * (1 - Math.cos(t * Math.PI / 2));
  pts.push(new THREE.Vector2(r, BASE_Y + BODY_H - 0.5 + Math.sin(t * Math.PI / 2) * 0.62));
}
pts.push(new THREE.Vector2(0.42, BASE_Y + BODY_H + 0.25));
pts.push(new THREE.Vector2(0, BASE_Y + BODY_H + 0.25));
const bodyMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfd1b4, roughness: 0.42, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.25, sheen: 0.4, sheenColor: 0xffffff,
});
bottle.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 128), bodyMat));

// ---- Collar, pump stem and head (soft-touch cream plastic).
const capMat = new THREE.MeshPhysicalMaterial({ color: 0xf7f2ea, roughness: 0.32, clearcoat: 0.4, clearcoatRoughness: 0.3 });
const topY = BASE_Y + BODY_H + 0.25;
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 96), capMat);
collar.position.y = topY + 0.25; bottle.add(collar);
const ribs = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.06, 96), capMat);
ribs.position.y = topY + 0.05; bottle.add(ribs);
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.55, 48), capMat);
stem.position.y = topY + 0.75; bottle.add(stem);
const headShape = new THREE.Shape();
headShape.moveTo(-0.42, -0.16); headShape.lineTo(0.42, -0.16); headShape.quadraticCurveTo(0.5, -0.16, 0.5, -0.06);
headShape.lineTo(0.5, 0.08); headShape.quadraticCurveTo(0.5, 0.16, 0.42, 0.16);
headShape.lineTo(-0.42, 0.16); headShape.quadraticCurveTo(-0.5, 0.16, -0.5, 0.06); headShape.lineTo(-0.5, -0.06);
headShape.quadraticCurveTo(-0.5, -0.16, -0.42, -0.16);
const head = new THREE.Mesh(new THREE.ExtrudeGeometry(headShape, { depth: 0.62, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 6, curveSegments: 16 }), capMat);
head.rotation.y = Math.PI / 2; head.position.set(-0.31, topY + 1.12, 0); bottle.add(head);
const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.95, 32), capMat);
nozzle.rotation.z = Math.PI / 2; nozzle.position.set(0.85, topY + 1.17, 0); bottle.add(nozzle);

// ---- Labels: canvas textures wrapped on a thin sleeve just outside the body.
function labelTexture(draw) {
  const c = document.createElement("canvas"); c.width = 1400; c.height = 1300;
  const g = c.getContext("2d"); draw(g, c.width, c.height);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const front = labelTexture((g, w, h) => {
  g.fillStyle = "#FBF7F0"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#A35848"; g.fillRect(0, 0, w, 18); g.fillRect(0, h - 18, w, 18);
  g.textAlign = "center"; g.fillStyle = "#6B6760";
  g.font = '30px "JetBrains Mono"'; g.letterSpacing = "10px"; g.fillText("DAILY · 200 ML", w / 2, 210);
  g.letterSpacing = "0px"; g.fillStyle = "#1A1814";
  g.font = '190px "Instrument Serif"'; g.fillText("Hydrating", w / 2, 520); g.fillText("Gel Cleanser", w / 2, 700);
  g.fillStyle = "#A35848"; g.fillRect(w / 2 - 60, 790, 120, 4);
  g.fillStyle = "#6B6760"; g.font = '600 46px "DM Sans"';
  g.fillText("Niacinamide · Ceramides", w / 2, 900); g.fillText("Fragrance free", w / 2, 970);
});
const back = labelTexture((g, w, h) => {
  g.fillStyle = "#FBF7F0"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#6B6760"; g.textAlign = "left"; g.font = '30px "JetBrains Mono"';
  const inci = ["INGREDIENTS: AQUA, GLYCERIN,", "COCAMIDOPROPYL BETAINE, NIACINAMIDE,", "CERAMIDE NP, SODIUM HYALURONATE,", "PANTHENOL, ALLANTOIN, CITRIC ACID…"];
  inci.forEach((l, i) => g.fillText(l, 330, 190 + i * 52));
  // EAN-13 style bars for 3606000537400 (decorative; proportions of a real symbol).
  const code = "3606000537400", bx = 360, by = 520, bw = 680, bh = 420;
  g.fillStyle = "#FFFFFF"; g.fillRect(bx - 50, by - 40, bw + 100, bh + 150);
  g.fillStyle = "#1A1814";
  let x = bx; const unit = bw / 95;
  const pattern = "101" + [...code.slice(1, 7)].map(d => ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"][+d]).join("")
    + "01010" + [...code.slice(7)].map(d => ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"][+d]).join("") + "101";
  [...pattern].forEach((b, i) => {
    const guard = i < 3 || (i >= 45 && i < 50) || i >= 92;
    if (b === "1") g.fillRect(x, by, unit + 0.4, bh + (guard ? 30 : 0));
    x += unit;
  });
  g.textAlign = "center"; g.font = '44px "JetBrains Mono"';
  g.fillText("3   606000   537400", w / 2, by + bh + 85);
});
function sleeve(tex, center) {
  const arc = Math.PI * 0.95, y0 = BASE_Y + 0.45, hgt = 2.35;
  const geo = new THREE.CylinderGeometry(R + 0.006, R + 0.006, hgt, 128, 1, true, center - arc / 2, arc);
  const m = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.55, clearcoat: 0.3, clearcoatRoughness: 0.4 }));
  m.position.y = y0 + hgt / 2; return m;
}
// Cylinder theta 0 faces +z rotated; π/2 offset puts the sleeve centre toward the camera.
bottle.add(sleeve(front, -Math.PI / 2 + Math.PI / 2));
bottle.add(sleeve(back, Math.PI));

if (view === "back") {
  bottle.rotation.y = Math.PI;      // barcode toward the camera
  bottle.rotation.z = -0.04;
  camera.position.set(0.0, 0.2, 15.5); camera.lookAt(0, 0.1, 0);
} else {
  bottle.rotation.y = -0.38;        // three-quarter turn so the pump reads
  bottle.rotation.z = 0.06;
}

renderer.render(scene, camera);
document.title = "ready";
</script>
</body>
</html>
