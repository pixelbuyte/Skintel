<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Captions for the cinematic AI ads (stock/build_roi.py): the hook over the AI B-roll, nothing over
     the demo (it carries its own captions), then a comment prompt before the end card.
     Transparent: render-alpha.mjs roi <name>. Times match SHOTS in build_roi.py. */
  @font-face { font-family: "TikTok Sans"; font-weight: 800; src: url("./fonts/TikTokSans-800.ttf"); }
  html, body { margin: 0; background: transparent !important; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .t { position: absolute; left: 60px; right: 60px; top: 300px; text-align: center; font-family: "TikTok Sans", sans-serif;
       color: #fff; font-weight: 800; font-size: 84px; line-height: 1.06;
       text-shadow: -5px -5px 0 #000, 5px -5px 0 #000, -5px 5px 0 #000, 5px 5px 0 #000, 0 6px 0 #000, 0 0 26px rgba(0,0,0,.55); }
  .t em { font-style: normal; color: #FF5A47; }
  html.print #stage { background: #2A2320; }
</style>
</head>
<body>
<div id="stage"><div class="t" id="cap"></div></div>
<script src="./engine.js"></script>
<script>
const E = window.__E, $ = id => document.getElementById(id);
// name: [duration (where the end card starts), [start, end, text]…]. The spoken lines are in
// build_roi.py; on-screen text says the same for sound-off viewers. The last caption is a comment
// prompt anyone can answer; the end card then asks for SKINSTEL.
const ADS = {
  '1ofthese': [12.4, [
    [0.0, 2.28, '<em>1</em> of these is<br>breaking you out'],
    [2.28, 4.5, 'and it’s probably not<br>the one you think 👀'],
    [4.5, 6.6, 'your bad days have<br>something in common'],
    [11.0, 12.4, 'which one is it?<br>guess in the comments 👇'],
  ]],
  'pov-scan': [12.0, [
    [0.0, 3.75, 'POV: you check if it’ll<br>break you out <em>before</em><br>you buy it'],
    [3.75, 5.0, 'scan the barcode'],
    [10.5, 12.0, 'what’s the last thing<br>that broke you out? 👇'],
  ]],
  'pov-conflicts': [12.0, [
    [0.0, 3.85, 'POV: 2 of your products<br>have been <em>fighting</em><br>every night'],
    [3.85, 5.9, 'every. single.<br>night.'],
    [10.8, 12.0, 'what’s in your<br>night routine? 👇'],
  ]],
  'pov-ask': [12.0, [
    [0.0, 5.25, 'POV: it’s 1am and you<br>still don’t know what<br>order these go in 😭'],
    [10.4, 12.0, 'what order do <em>you</em><br>do yours in? 👇'],
  ]],
};
const q = new URLSearchParams(location.search);
const [DURATION, CAPS] = ADS[q.get('f')] || ADS['1ofthese'];
function render(t) {
  const c = CAPS.find(([s, e]) => t >= s && t < e);
  const el = $('cap');
  if (!c) { el.style.opacity = 0; return; }
  if (el.dataset.s !== String(c[0])) { el.dataset.s = String(c[0]); el.innerHTML = c[2]; }
  const p = E.easeEmil(E.seg(t, c[0], c[0] + 0.14));
  el.style.opacity = 1;
  el.style.transform = `scale(${E.lerp(1.14, 1, p)})`;
}
window.__seek = t => { render(t); return true; };
window.__duration = DURATION;
if (q.get('print')) document.documentElement.classList.add('print');
render(0.5);
</script>
</body>
</html>
