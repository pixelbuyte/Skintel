# XcodeGen spec. Regenerate Skintel.xcodeproj after adding/removing files:
#   brew install xcodegen && xcodegen generate
# The generated project is committed so the app opens without XcodeGen installed.
name: Skintel

options:
  bundleIdPrefix: com.skintel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    DEAD_CODE_STRIPPING: "YES"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  SkintelCore:
    path: SkintelCore

targets:
  Skintel:
    type: application
    platform: iOS
    sources:
      - path: Skintel
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
    dependencies:
      - package: SkintelCore
        product: SkintelCore
    # XcodeGen writes this file from `properties` on every generate — edit here, not the plist.
    entitlements:
      path: Skintel/Resources/Skintel.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Skintel/Resources/Info.plist
      properties:
        CFBundleDisplayName: Skintel
        CFBundleName: Skintel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
        NSCameraUsageDescription: Skintel uses the camera to scan product barcodes and photograph ingredient labels.
        NSPhotoLibraryUsageDescription: Skintel reads a photo you choose so it can read the ingredient label in it.
        # Public client configuration, supplied by Config/Config.xcconfig (see Config.example.xcconfig)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        API_BASE_URL: $(API_BASE_URL)
        LEGAL_TERMS_URL: $(LEGAL_TERMS_URL)
        LEGAL_PRIVACY_URL: $(LEGAL_PRIVACY_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skintel.app
        PRODUCT_NAME: Skintel
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
    scheme:
      testTargets:
        - SkintelTests
        - SkintelUITests
      gatherCoverageData: true
      # Local StoreKit testing: the paywall loads these products in the simulator without
      # App Store Connect. Remove from the scheme (Edit Scheme → Run → Options) to hit the real store.
      storeKitConfiguration: Skintel/Resources/Skintel.storekit

  SkintelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkintelTests
    dependencies:
      - target: Skintel
      - package: SkintelCore
        product: SkintelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skintel.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

  SkintelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SkintelUITests
    dependencies:
      - target: Skintel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skintel.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Skintel
