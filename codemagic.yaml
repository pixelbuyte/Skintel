# Codemagic pipeline for the native Skintel/Skinstel iOS app.
#
# Verified against this repository (not assumed):
#   - Xcode project:      ios/Skintel/Skintel.xcodeproj  (ios/App/App.xcodeproj is the
#                          deprecated Capacitor shell — see MIGRATION_MAP.md — never used here)
#   - Shared scheme:      Skintel  (ios/Skintel/Skintel.xcodeproj/xcshareddata/xcschemes/Skintel.xcscheme)
#   - App target:         Skintel
#   - Bundle identifier:  com.skintel.app
#   - iOS deployment tgt: 17.0  (ios/Skintel/project.yml)
#   - Test targets:       SkintelTests (unit), SkintelUITests (UI) — both wired into the Skintel scheme
#   - SwiftPM:             one local package, SkintelCore (ios/Skintel/SkintelCore) — no remote
#                          dependencies anywhere under ios/Skintel, so there is nothing to fetch
#                          over the network to resolve
#   - Environment config:  Supabase URL + anon key and the Vercel API base URL are read from
#                          Config/Config.xcconfig (gitignored, generated per-build below); the
#                          anon key is a public client key by design (protected by Supabase RLS),
#                          not a secret — see Config/Config.example.xcconfig
#   - Xcode project is generated by XcodeGen (ios/Skintel/project.yml) and the generated
#     .xcodeproj is committed, so `xcodegen generate` here is a consistency check, not a
#     hard requirement

workflows:

  # ============================================================
  # WORKFLOW 1 — ios-ci
  # ============================================================
  # Verifies the app compiles and its tests pass on every push, with no Apple/App Store
  # credentials required. Runs against a simulator; distribution signing is disabled.
  ios-ci:
    name: ios-ci
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: "ios/Skintel/Skintel.xcodeproj"
        XCODE_SCHEME: "Skintel"
        SIMULATOR_DESTINATION: "platform=iOS Simulator,name=iPhone 16"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      # No secrets required: the Supabase anon key and API base URL are public client
      # config (see comment above), so ios-ci copies the example file verbatim instead of
      # reading a secrets group. DEVELOPMENT_TEAM is left blank — fine, since signing is
      # disabled for this workflow below.
      - name: Write public Config.xcconfig (no secrets needed for CI)
        script: |
          set -e
          cp "$CM_BUILD_DIR/ios/Skintel/Config/Config.example.xcconfig" \
             "$CM_BUILD_DIR/ios/Skintel/Config/Config.xcconfig"

      - name: Regenerate Xcode project from project.yml
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/Skintel" && xcodegen generate

      - name: Resolve Swift Package Manager dependencies
        script: |
          set -e
          xcodebuild -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Run SkintelCore package tests (platform-independent, no simulator needed)
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/Skintel/SkintelCore" && swift test

      - name: Build the app for the iOS Simulator (no distribution signing)
        script: |
          set -e -o pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "$SIMULATOR_DESTINATION" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$CM_BUILD_DIR/build/logs/ios-ci-build.log" \
            | xcbeautify --renderer github-actions

      - name: Run SkintelTests and SkintelUITests on the simulator
        script: |
          set -e -o pipefail
          xcodebuild test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "$SIMULATOR_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee "$CM_BUILD_DIR/build/logs/ios-ci-test.log" \
            | xcbeautify --renderer github-actions

    artifacts:
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - rrswat00@gmail.com
        notify:
          success: false
          failure: true

  # ============================================================
  # WORKFLOW 2 — ios-release
  # ============================================================
  # Archives Skintel for App Store distribution and uploads to TestFlight. Requires Apple
  # credentials to be configured in Codemagic first (see the end of this file) — until
  # then this workflow will fail at the signing step, which is expected and safe; ios-ci
  # above does not depend on any of this.
  ios-release:
    name: ios-release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key integration connected under Codemagic →
      # Team settings → Integrations → App Store Connect. Rename this to match whatever
      # you call it there (Codemagic's recommended, secure way to hand it credentials —
      # nothing here is a literal key). If you'd rather wire raw env vars instead of the
      # integration, add APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER and
      # APP_STORE_CONNECT_PRIVATE_KEY (the .p8 contents) as secure vars in the group below
      # and pass them explicitly via --issuer-id/--key-id/--private-key on each
      # app-store-connect/keychain command; the integration form below is preferred.
      app_store_connect: skintel_asc
    environment:
      xcode: 16.0
      groups:
        # Configure in Codemagic → App settings → Environment variables. All Secure.
        #   DEVELOPMENT_TEAM     — Apple Developer Team ID (App Store Connect → Membership)
        #   SUPABASE_URL         — https://fgttlowgvoonedqglyle.supabase.co
        #   SUPABASE_ANON_KEY    — public anon key (see Config.example.xcconfig)
        #   API_BASE_URL         — https://www.skinstel.com/api
        - skintel_ios_release
      vars:
        XCODE_PROJECT: "ios/Skintel/Skintel.xcodeproj"
        XCODE_SCHEME: "Skintel"
        BUNDLE_ID: "com.skintel.app"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.skintel.app

    # Manual/API-triggered only — a release build shouldn't fire on every push. Start it
    # from the Codemagic dashboard or API once credentials below are configured.
    triggering:
      events: []

    scripts:
      - name: Determine the next build number from App Store Connect
        script: |
          set -e
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          echo "BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))" >> "$CM_ENV"

      - name: Write Config.xcconfig from secure environment variables
        script: |
          set -e
          SUPA_URL_ESCAPED=$(echo "$SUPABASE_URL" | sed 's#//#/$()/#')
          API_URL_ESCAPED=$(echo "$API_BASE_URL" | sed 's#//#/$()/#')
          cat > "$CM_BUILD_DIR/ios/Skintel/Config/Config.xcconfig" <<CONFIG
          DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          SUPABASE_URL = $SUPA_URL_ESCAPED
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY
          API_BASE_URL = $API_URL_ESCAPED
          CONFIG

      - name: Install XcodeGen and regenerate the Xcode project
        script: |
          set -e
          brew install xcodegen
          cd "$CM_BUILD_DIR/ios/Skintel" && xcodegen generate

      - name: Fetch signing certificate and provisioning profile from App Store Connect
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates

      - name: Apply the fetched signing files to the Xcode project
        script: |
          set -e
          xcode-project use-profiles

      - name: Archive for App Store distribution
        script: |
          set -e -o pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Skintel.xcarchive" \
            -destination "generic/platform=iOS" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$CM_BUILD_DIR/build/logs/ios-release-archive.log" \
            | xcbeautify --renderer github-actions

      - name: Export the signed IPA
        script: |
          set -e
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Skintel.xcarchive" \
            -exportOptionsPlist "$HOME/export_options.plist" \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/Skintel.xcarchive
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - rrswat00@gmail.com
        notify:
          success: true
          failure: true
