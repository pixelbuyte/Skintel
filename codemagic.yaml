# Codemagic CI/CD configuration for Skintel (native SwiftUI iOS app).
#
# Detected from this repository:
#   Xcode project : ios/Skintel/Skintel.xcodeproj   (generated by XcodeGen from ios/Skintel/project.yml)
#   Scheme        : Skintel                          (shared scheme, builds + tests + archives)
#   App target    : Skintel                          (bundle id: com.skintel.app)
#   Test targets  : SkintelTests (unit), SkintelUITests (UI)
#   Min iOS       : 17.0                              Swift: 6.0
#   Dependencies  : local Swift Package "SkintelCore" (ios/Skintel/SkintelCore) - resolved by
#                   Xcode's built-in SPM integration, no external registry/auth needed.
#   Config        : ios/Skintel/Config/Config.xcconfig is gitignored (see Config.example.xcconfig
#                   in the same folder). It only ever holds PUBLIC client values - the Supabase
#                   anon key and API base URL are not secrets, by the project's own design (see
#                   comments in Config.example.xcconfig: the anon key ships in the public web
#                   bundle and is protected by Supabase Row Level Security). The only value that
#                   is machine/team specific is DEVELOPMENT_TEAM, which is injected below from a
#                   Codemagic environment variable and never committed to git.
#
# All server-side secrets (Supabase service-role key, Stripe secret key/webhook secret, any
# AI provider keys) live in /api/*.ts and Vercel's own environment configuration - they are not
# referenced anywhere in the iOS project or in this file.
#
# Workflows:
#   ios-ci      - builds and tests Skintel on an iOS Simulator. No signing, no credentials, no
#                 publishing required. Works immediately once this repo is connected to Codemagic.
#   ios-release - archives, signs and uploads Skintel to TestFlight / App Store Connect. Requires
#                 the Apple credentials documented in that workflow's comments before it can run.

workflows:
  ios-ci:
    name: iOS CI - Build & Test (Skintel)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/Skintel/Skintel.xcodeproj"
        XCODE_SCHEME: "Skintel"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/org.swift.swiftpm
        - $CM_BUILD_DIR/ios/Skintel/SkintelCore/.build
    scripts:
      - name: Set up public client configuration (Config.xcconfig)
        script: |
          set -euo pipefail
          # Config.xcconfig is gitignored. It only carries public client config (see header
          # comment above) - no DEVELOPMENT_TEAM is needed to build for the Simulator, so the
          # example file can be used as-is.
          cp "$CM_BUILD_DIR/ios/Skintel/Config/Config.example.xcconfig" \
             "$CM_BUILD_DIR/ios/Skintel/Config/Config.xcconfig"

      - name: Resolve Swift Package Manager dependencies
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Find an available iPhone simulator
        script: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || brew install jq
          DEVICE_NAME=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | contains("com.apple.CoreSimulator.SimRuntime.iOS")))
            | sort_by(.key)
            | reverse
            | .[0].value
            | map(select(.name | startswith("iPhone")))
            | .[0].name
          ')
          if [ -z "$DEVICE_NAME" ] || [ "$DEVICE_NAME" = "null" ]; then
            echo "No available iPhone simulator found on this build machine" >&2
            exit 1
          fi
          echo "Using simulator: $DEVICE_NAME"
          echo "SIMULATOR_NAME=$DEVICE_NAME" >> "$CM_ENV"

      - name: Build and test Skintel (SkintelTests + SkintelUITests)
        script: |
          set -euo pipefail
          gem list -i xcpretty >/dev/null 2>&1 || gem install xcpretty --no-document
          mkdir -p "$CM_BUILD_DIR/build/ios-ci"
          set -o pipefail
          xcodebuild clean test \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -resultBundlePath "$CM_BUILD_DIR/build/ios-ci/Skintel.xcresult" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run SkintelCore package tests (cross-platform logic)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios/Skintel/SkintelCore"
          swift test
    artifacts:
      - build/ios-ci/Skintel.xcresult
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  ios-release:
    name: iOS Release - App Store / TestFlight (Skintel)
    max_build_duration: 60
    instance_type: mac_mini_m2
    # Codemagic > Team settings > Integrations > App Store Connect: create an API key there
    # (Users and Access > Integrations > App Store Connect API in App Store Connect, "App Manager"
    # role) and give it the nickname below - or rename this line to match whatever nickname you
    # choose. That single integration supplies the Issuer ID, Key ID and .p8 private key
    # (APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_KEY_IDENTIFIER / APP_STORE_CONNECT_PRIVATE_KEY)
    # to every `auth: integration` reference below - none of it is ever stored in this file.
    integrations:
      app_store_connect: skintel_app_store_connect
    environment:
      xcode: latest
      groups:
        # Create this group under Codemagic > Team settings > Environment variables with:
        #   DEVELOPMENT_TEAM  - your 10-character Apple Developer Team ID (Membership page)
        #   APP_APPLE_ID      - the app's numeric Apple ID from App Store Connect > General >
        #                       App Information (only exists once the app record is created there)
        # Neither value is a secret, but keeping them out of the yaml means updating them never
        # requires a commit.
        - ios_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.skintel.app
      vars:
        XCODE_PROJECT: "ios/Skintel/Skintel.xcodeproj"
        XCODE_SCHEME: "Skintel"
        BUNDLE_ID: "com.skintel.app"
    scripts:
      - name: Set up public client configuration (Config.xcconfig)
        script: |
          set -euo pipefail
          cp "$CM_BUILD_DIR/ios/Skintel/Config/Config.example.xcconfig" \
             "$CM_BUILD_DIR/ios/Skintel/Config/Config.xcconfig"
          echo "DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM" >> "$CM_BUILD_DIR/ios/Skintel/Config/Config.xcconfig"

      - name: Resolve Swift Package Manager dependencies
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Set up code signing settings on Xcode project
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Determine next build number from App Store Connect
        script: |
          set -euo pipefail
          # Falls back to 0 (-> build 1) the first time, before any build has ever been uploaded.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_APPLE_ID" || echo 0)
          echo "Latest App Store Connect build number: $LATEST_BUILD_NUMBER"
          echo "BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))" >> "$CM_ENV"

      - name: Build ipa for distribution
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs="CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
