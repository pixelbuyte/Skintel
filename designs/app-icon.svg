<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Skintel iOS app icon — master 1024px, full-bleed (iOS applies the squircle mask).
    Mark geometry matches the shipping logo at public/icons/skintel.svg:
    one large four-point star with two companion sparkles.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B2634F"/>
      <stop offset="0.55" stop-color="#A35848"/>
      <stop offset="1" stop-color="#8E4538"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFEFA" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#FFFEFA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- star, authored in a 100x100 box and scaled to the 1024 master -->
  <g transform="scale(10.24)" fill="#FFFEFA">
    <path d="M50 23 L56 44 L77 50 L56 56 L50 77 L44 56 L23 50 L44 44 Z"/>
    <path d="M71 63.6 L72.6 69.4 L78.4 71 L72.6 72.6 L71 78.4 L69.4 72.6 L63.6 71 L69.4 69.4 Z" opacity="0.9"/>
    <path d="M70.4 17 L71.6 21.2 L75.8 22.4 L71.6 23.6 L70.4 27.8 L69.2 23.6 L65 22.4 L69.2 21.2 Z" opacity="0.75"/>
  </g>
</svg>
