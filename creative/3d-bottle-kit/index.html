<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skintel 3D bottle studio</title><style>body{margin:0;background:#eae9e1;color:#203e32;font:16px Arial}header{position:absolute;z-index:2;top:24px;left:28px}h1{font-size:23px;margin:0 0 8px}small{color:#68766d}canvas{display:block}nav{position:absolute;bottom:28px;left:5%;width:90%;display:flex;gap:8px;flex-wrap:wrap}button,select{padding:13px 18px;border:1px solid #bbc6b9;border-radius:18px;background:#faf9f3;color:#244537;font-size:14px;cursor:pointer}#result{position:absolute;right:24px;top:28px;max-width:280px;background:#faf9f3;padding:20px;border-radius:20px;display:none;line-height:1.6}#beam{position:absolute;top:40%;left:20%;width:60%;height:2px;background:#8eefaa;box-shadow:0 0 18px #4f6;display:none;pointer-events:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><header><h1>Skintel / Bottle studio</h1><small>Drag to orbit · Scroll to zoom · Reference models + original concepts</small></header><div id="result"></div><div id="beam"></div><nav><select id="pick"></select><button id="rotate">Pause rotation</button><button id="scan">Play barcode demo</button><button id="download">Download model</button></nav><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';
const data=await fetch('manifest.json').then(r=>r.json());let model,index=0,turn=true,scanStart=null,loadId=0;const scene=new THREE.Scene();scene.background=new THREE.Color('#eae9e1');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.001,20);camera.position.set(.19,.16,.30);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.065,0);controls.enableDamping=true;controls.maxDistance=.65;controls.minDistance=.12;
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(-.2,.4,.25);light.castShadow=true;light.shadow.mapSize.set(2048,2048);light.shadow.camera.left=-.2;light.shadow.camera.right=.2;light.shadow.camera.top=.3;light.shadow.camera.bottom=-.2;light.shadow.camera.near=.01;light.shadow.camera.far=2;light.shadow.bias=-.0002;scene.add(light);const floor=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.MeshStandardMaterial({color:'#dedfd4',roughness:.7}));floor.rotation.x=-Math.PI/2;floor.position.y=-.0005;floor.receiveShadow=true;scene.add(floor);
const pick=document.querySelector('#pick');data.forEach((p,i)=>pick.add(new Option(p.brand+' — '+p.id,i)));const loader=new GLTFLoader();async function load(i){const id=++loadId;index=i;scanStart=null;document.querySelector('#beam').style.display='none';document.querySelector('#result').style.display='none';try{const gltf=await loader.loadAsync(data[i].model);if(id!==loadId)return;if(model)scene.remove(model);model=gltf.scene;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});scene.add(model);controls.target.y=new THREE.Box3().setFromObject(model).max.y*.45;}catch(e){document.querySelector('#result').style.display='block';document.querySelector('#result').textContent='Could not load model. Serve this folder over HTTP. '+e.message;}}
pick.onchange=()=>load(Number(pick.value));document.querySelector('#rotate').onclick=e=>{turn=!turn;e.target.textContent=turn?'Pause rotation':'Resume rotation';};document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.href=data[index].model;a.download=data[index].id+'.gltf';a.click();};document.querySelector('#scan').onclick=()=>{scanStart=performance.now();turn=false;document.querySelector('#rotate').textContent='Resume rotation';document.querySelector('#result').style.display='none';};
function frame(now){requestAnimationFrame(frame);if(model){if(scanStart!==null){const t=(now-scanStart)/1000;model.rotation.y=Math.PI*Math.min(t/1.5,1);const beam=document.querySelector('#beam');beam.style.display=t>1.5&&t<4?'block':'none';beam.style.top=(36+Math.sin(t*3)*9)+'%';if(t>=4){const r=document.querySelector('#result');r.style.display='block';r.textContent='DEMO LOOKUP\n'+data[index].brand+'\n'+data[index].barcode+'\nFixture result — not a live camera scan.';r.style.whiteSpace='pre-line';scanStart=null;}}else if(turn)model.rotation.y=now*.0002;}controls.update();renderer.render(scene,camera);}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});load(0);
</script></body></html>
