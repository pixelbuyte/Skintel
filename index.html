<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── SEO ──────────────────────────────────────────────────────────────
         Absolute URLs are required here — social crawlers do not resolve
         relative paths, so the origin is hardcoded rather than derived.

         Canonical origin: https://www.skinstel.com — the apex skinstel.com
         308-redirects to www, so www is the form to use. If it ever
         changes, find-and-replace it in this file, public/robots.txt and
         public/sitemap.xml together: a stale value points every crawler
         and every link preview at a host that does not exist.
    ─────────────────────────────────────────────────────────────────────── -->
    <title>Skintel — find the ingredient that's breaking you out</title>
    <meta name="description" content="Your skin isn't broken — your routine is fighting itself. Skintel scans every product you own, cross-references the ingredient lists, and finds the one ingredient hiding across all of them." />
    <link rel="canonical" href="https://www.skinstel.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Skintel" />
    <meta name="keywords" content="skincare ingredients, INCI scanner, comedogenic ingredients, breakout triggers, fragrance allergens, skincare tracker, ingredient checker" />

    <!-- ── Open Graph (Facebook, LinkedIn, iMessage, WhatsApp, Discord) ──── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skintel" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.skinstel.com/" />
    <meta property="og:title" content="Skintel — find the ingredient that's breaking you out" />
    <meta property="og:description" content="Your skin isn't broken — your routine is fighting itself. Scan every product you own and find the one ingredient hiding across all of them." />
    <meta property="og:image" content="https://www.skinstel.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.skinstel.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Skintel — your skin isn't broken, your routine is fighting itself." />

    <!-- ── Twitter / X ───────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skintel — find the ingredient that's breaking you out" />
    <meta name="twitter:description" content="Your skin isn't broken — your routine is fighting itself. Scan every product you own and find the one ingredient hiding across all of them." />
    <meta name="twitter:image" content="https://www.skinstel.com/og-image.png" />
    <meta name="twitter:image:alt" content="Skintel — your skin isn't broken, your routine is fighting itself." />

    <meta name="theme-color" content="#A35848" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skintel" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- ── Structured data: lets Google show a rich result for "Skintel" ─── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Skintel",
      "url": "https://www.skinstel.com/",
      "description": "Skintel scans the ingredient list of every skincare product you own and finds the ingredient that correlates with your breakouts.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript",
      "image": "https://www.skinstel.com/og-image.png",
      "featureList": [
        "Full INCI ingredient scanner — paste, photo, or barcode",
        "Personal trigger map across every product you own",
        "Side-by-side product comparison",
        "Routine analysis and breakout journal"
      ],
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Pro Monthly",
          "price": "9",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Pro Yearly",
          "price": "79",
          "priceCurrency": "USD"
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
